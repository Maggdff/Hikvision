name: Flutter CI

on:
  push:
    branches: [main, match-hayaa]
    paths: ['app/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/flutter.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VOICEUP_API_URL: ${{ vars.VOICEUP_API_URL }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # الإصدار مثبّت هنا؛ غيّره ليطابق flutter --version عندك
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      # يولّد هيكل android/ بنفس الباكيج com.voiceup.app (لا يوجد توقيع أو إصدار مخصص هنا)
      - name: Create Android scaffold
        run: |
          flutter create . --org com.voiceup --project-name app --platforms android
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          perms=''.join('    <uses-permission android:name="android.permission.%s"/>\n'%n for n in ['INTERNET','RECORD_AUDIO','MODIFY_AUDIO_SETTINGS','BLUETOOTH','BLUETOOTH_CONNECT'])
          if 'RECORD_AUDIO' not in s:
              s=s.replace('<application',perms+'    <application',1)
          open(p,'w',encoding='utf-8').write(s)
          PY

      # مفتاح debug ثابت من سر GitHub لتبقى بصمة SHA-1 نفسها المسجلة في Firebase
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi

      # إعدادات Firebase العامة تُستخرج من سر GOOGLE_SERVICES_JSON وتمرَّر وقت البناء
      - name: Read Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > /tmp/gs.json
            python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('/tmp/gs.json'))
          c=[x for x in d['client'] if x['client_info']['android_client_info']['package_name']=='com.voiceup.app'][0]
          o=d['project_info']
          print('FB_DEFINES=--dart-define=FB_API_KEY=%s --dart-define=FB_APP_ID=%s --dart-define=FB_SENDER_ID=%s --dart-define=FB_PROJECT_ID=%s --dart-define=FB_STORAGE_BUCKET=%s' % (
            c['api_key'][0]['current_key'], c['client_info']['mobilesdk_app_id'], o['project_number'], o['project_id'], o.get('storage_bucket','')))
          PY
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # نسخة release صغيرة: R8 + حذف الرموز + ملف لكل معمارية (الـ 170MB كانت debug لكل المعماريات)
      - name: Build release APKs (split per ABI)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols \
            --dart-define=VOICEUP_API_URL="$VOICEUP_API_URL" $FB_DEFINES
          ls -la build/app/outputs/flutter-apk/*.apk | awk '{printf "%s  %.1f MB\n", $NF, $5/1048576}'

      - uses: actions/upload-artifact@v4
        with:
          name: voiceup-flutter-release-apks
          path: app/build/app/outputs/flutter-apk/*-release.apk
