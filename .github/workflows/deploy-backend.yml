name: Deploy Backend (Cloud Run)

# يدوي فقط: لا نشر تلقائي قبل مراجعة البيئة والأسرار
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # مصادقة Workload Identity بدل مفاتيح خدمة طويلة العمر

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: voiceup-api
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          source: backend
          env_vars: |
            FIREBASE_PROJECT_ID=voice-up-84ee1
            RUN_MIGRATIONS=true
          # الأسرار تُقرأ من Secret Manager عند التشغيل، ولا تظهر في السجلات
          secrets: |
            DATABASE_URL=voiceup-database-url:latest
            LIVEKIT_URL=voiceup-livekit-url:latest
            LIVEKIT_API_KEY=voiceup-livekit-api-key:latest
            LIVEKIT_API_SECRET=voiceup-livekit-api-secret:latest
