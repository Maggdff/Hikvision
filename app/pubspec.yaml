name: app
description: VoiceUp - غرف صوتية اجتماعية (Flutter)
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  livekit_client: ^2.1.0
  svgaplayer_flutter: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/svga/
    - assets/gifts/
