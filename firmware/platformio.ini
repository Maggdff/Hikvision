; WaterGate box firmware (ESP32 + PN532 NFC + W5500 Ethernet).  NOT yet compiled or tested on hardware.
; The core 3.x platform (pioarduino) is needed for ETH.h with the W5500 SPI PHY.
; For Wi-Fi instead of Ethernet: set -DUSE_ETH_W5500=0 below.
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit PN532@^1.3.1
    adafruit/Adafruit BusIO@^1.16.0
build_flags =
    -DUSE_ETH_W5500=1
    -DCORE_DEBUG_LEVEL=1
